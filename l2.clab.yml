name: dc-l2

topology:
  defaults:
    kind: linux
    image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    core1: {}
    core2: {}
    agg1: {}
    agg2: {}
    acc1: {}
    acc2: {}
    acc3: {}
    acc4: {}
    client1: {}
    client2: {}
    client3: {}
    client4: {}
    client5: {}
    client6: {}
    client7: {}
    client8: {}

  links:
    # core - core
    - endpoints: ["core1:eth1", "core2:eth1"]
    # core - agg
    - endpoints: ["core1:eth2", "agg1:eth1"]
    - endpoints: ["core1:eth3", "agg2:eth2"]
    - endpoints: ["core2:eth2", "agg1:eth2"]
    - endpoints: ["core2:eth4", "agg2:eth3"]
    # agg1 - access
    - endpoints: ["agg1:eth4", "acc1:eth1"]
    - endpoints: ["agg1:eth5", "acc2:eth1"]
    - endpoints: ["agg1:eth6", "acc3:eth4"]
    - endpoints: ["agg1:eth7", "acc4:eth4"]
    # agg2 - access
    - endpoints: ["agg2:eth7", "acc1:eth4"]
    - endpoints: ["agg2:eth6", "acc2:eth4"]
    - endpoints: ["agg2:eth4", "acc3:eth1"]
    - endpoints: ["agg2:eth5", "acc4:eth1"]
    # access - clients
    - endpoints: ["acc1:eth2", "client1:eth1"]
    - endpoints: ["acc1:eth3", "client2:eth1"]
    - endpoints: ["acc2:eth2", "client3:eth1"]
    - endpoints: ["acc2:eth3", "client4:eth1"]
    - endpoints: ["acc3:eth2", "client5:eth1"]
    - endpoints: ["acc3:eth3", "client6:eth1"]
    - endpoints: ["acc4:eth2", "client7:eth1"]
    - endpoints: ["acc4:eth3", "client8:eth1"]