frr defaults datacenter
hostname spine2
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
exit
interface eth1
 ip address 10.1.2.0/31
exit
interface eth2
 ip address 10.1.2.2/31
exit
interface eth3
 ip address 10.1.2.4/31
exit
interface eth4
 ip address 10.1.2.6/31
exit
!
bfd
 profile rapide
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor LEAFS peer-group
 neighbor LEAFS remote-as external
 neighbor LEAFS bfd profile rapide
 neighbor 10.1.2.1 peer-group LEAFS
 neighbor 10.1.2.3 peer-group LEAFS
 neighbor 10.1.2.5 peer-group LEAFS
 neighbor 10.1.2.7 peer-group LEAFS
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor LEAFS activate
 exit-address-family
 !
 ! le spine relaie EVPN sans toucher au next-hop (= VTEP du leaf d'origine)
 address-family l2vpn evpn
  neighbor LEAFS activate
  neighbor LEAFS attribute-unchanged next-hop
 exit-address-family
exit
