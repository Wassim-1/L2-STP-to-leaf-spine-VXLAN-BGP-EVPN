frr defaults datacenter
hostname leaf2
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.12/32
exit
interface eth1
 ip address 10.1.1.3/31
exit
interface eth2
 ip address 10.1.2.3/31
exit
!
vrf VRF-T1
 vni 50001
exit-vrf
vrf VRF-T2
 vni 50002
exit-vrf
!
bfd
 profile rapide
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
! underlay : eBGP vers les 2 spines, ECMP, BFD ; la même session porte EVPN
router bgp 65002
 bgp router-id 10.0.0.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd profile rapide
 neighbor 10.1.1.2 peer-group SPINES
 neighbor 10.1.2.2 peer-group SPINES
 !
 address-family ipv4 unicast
  network 10.0.0.12/32
  neighbor SPINES activate
  maximum-paths 2
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
  vni 10010
   route-target import 65000:10010
   route-target export 65000:10010
  exit-vni
  vni 10011
   route-target import 65000:10011
   route-target export 65000:10011
  exit-vni
  vni 10020
   route-target import 65000:10020
   route-target export 65000:10020
  exit-vni
  vni 10021
   route-target import 65000:10021
   route-target export 65000:10021
  exit-vni
 exit-address-family
exit
!
! locataire 1 : routes type 5 (sous-réseaux) dans le L3VNI 50001
router bgp 65002 vrf VRF-T1
 bgp router-id 10.0.0.12
 no bgp ebgp-requires-policy
 ! le profil datacenter active deterministic-med : la route locale peut alors
 ! perdre face à une route importée plus ancienne et le type 5 n'est plus annoncé
 no bgp deterministic-med
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50001
  route-target export 65000:50001
 exit-address-family
exit
!
! locataire 2 : routes type 5 (sous-réseaux) dans le L3VNI 50002
router bgp 65002 vrf VRF-T2
 bgp router-id 10.0.0.12
 no bgp ebgp-requires-policy
 ! le profil datacenter active deterministic-med : la route locale peut alors
 ! perdre face à une route importée plus ancienne et le type 5 n'est plus annoncé
 no bgp deterministic-med
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50002
  route-target export 65000:50002
 exit-address-family
exit
