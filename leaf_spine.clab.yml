name: dc-ls

# Plan de ports (conception 4.8) :
#   leafN  : eth1 -> spine1, eth2 -> spine2, eth3 -> hôte Locataire 1, eth4 -> hôte Locataire 2
#   spineN : ethN -> leafN
# Configuration FRR (underlay + EVPN) : configs/<noeud>/frr.conf
# Ponts, VXLAN, VRF et hôtes : leaf_spine.sh
topology:
  defaults:
    kind: linux
    image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    spine1: { image: "quay.io/frrouting/frr:10.2.1", binds: [ "configs/daemons:/etc/frr/daemons", "configs/vtysh.conf:/etc/frr/vtysh.conf", "configs/spine1/frr.conf:/etc/frr/frr.conf" ] }
    spine2: { image: "quay.io/frrouting/frr:10.2.1", binds: [ "configs/daemons:/etc/frr/daemons", "configs/vtysh.conf:/etc/frr/vtysh.conf", "configs/spine2/frr.conf:/etc/frr/frr.conf" ] }
    leaf1:  { image: "quay.io/frrouting/frr:10.2.1", binds: [ "configs/daemons:/etc/frr/daemons", "configs/vtysh.conf:/etc/frr/vtysh.conf", "configs/leaf1/frr.conf:/etc/frr/frr.conf" ] }
    leaf2:  { image: "quay.io/frrouting/frr:10.2.1", binds: [ "configs/daemons:/etc/frr/daemons", "configs/vtysh.conf:/etc/frr/vtysh.conf", "configs/leaf2/frr.conf:/etc/frr/frr.conf" ] }
    leaf3:  { image: "quay.io/frrouting/frr:10.2.1", binds: [ "configs/daemons:/etc/frr/daemons", "configs/vtysh.conf:/etc/frr/vtysh.conf", "configs/leaf3/frr.conf:/etc/frr/frr.conf" ] }
    leaf4:  { image: "quay.io/frrouting/frr:10.2.1", binds: [ "configs/daemons:/etc/frr/daemons", "configs/vtysh.conf:/etc/frr/vtysh.conf", "configs/leaf4/frr.conf:/etc/frr/frr.conf" ] }
    # mêmes hôtes que l'architecture A (EF5)
    client1: {}   # h11
    client2: {}   # h21
    client3: {}   # h12
    client4: {}   # h22
    client5: {}   # h13
    client6: {}   # h23
    client7: {}   # h14
    client8: {}   # h24

  links:
    # spine1 - leaf
    - endpoints: [ "spine1:eth1", "leaf1:eth1" ]
    - endpoints: [ "spine1:eth2", "leaf2:eth1" ]
    - endpoints: [ "spine1:eth3", "leaf3:eth1" ]
    - endpoints: [ "spine1:eth4", "leaf4:eth1" ]
    # spine2 - leaf
    - endpoints: [ "spine2:eth1", "leaf1:eth2" ]
    - endpoints: [ "spine2:eth2", "leaf2:eth2" ]
    - endpoints: [ "spine2:eth3", "leaf3:eth2" ]
    - endpoints: [ "spine2:eth4", "leaf4:eth2" ]
    # leaf - hôtes
    - endpoints: [ "leaf1:eth3", "client1:eth1" ]
    - endpoints: [ "leaf1:eth4", "client2:eth1" ]
    - endpoints: [ "leaf2:eth3", "client3:eth1" ]
    - endpoints: [ "leaf2:eth4", "client4:eth1" ]
    - endpoints: [ "leaf3:eth3", "client5:eth1" ]
    - endpoints: [ "leaf3:eth4", "client6:eth1" ]
    - endpoints: [ "leaf4:eth3", "client7:eth1" ]
    - endpoints: [ "leaf4:eth4", "client8:eth1" ]
    # câble de rechange pour la mobilité de h11 (leaf1 -> leaf3), S6
    - endpoints: [ "leaf3:eth5", "client1:eth2" ]
